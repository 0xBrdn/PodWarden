apiVersion: v1
kind: Namespace
metadata:
  name: podwarden-system
  labels:
    app.kubernetes.io/name: podwarden
    app.kubernetes.io/component: system
    # The responder is fully compliant with the "restricted" Pod Security Standard.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod-apps
  labels:
    app.kubernetes.io/name: prod-apps
    environment: production
