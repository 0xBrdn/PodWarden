# Helm values for falcosecurity/falco
# Driver : modern_ebpf (CO-RE, kernel >= 5.8 with BTF)
# Rules  : injected with --set-file (see README), NOT duplicated here
# Output : Falco -> Falcosidekick -> PodWarden webhook

driver:
  kind: modern_ebpf

# Kubernetes metadata enrichment (k8s.ns.name, k8s.pod.name, ...).
# PodWarden refuses alerts without these two fields.
collectors:
  enabled: true
  kubernetes:
    enabled: true

falco:
  json_output: true
  json_include_output_property: true
  # http_output is wired automatically by the chart when falcosidekick.enabled=true.

falcosidekick:
  enabled: true
  fullfqdn: false
  config:
    # The webhook secret is NOT stored in this file. The README creates a Secret
    # holding WEBHOOK_CUSTOMHEADERS="X-Webhook-Secret:<secret>" and references it
    # with --set falcosidekick.config.existingSecret=falcosidekick-webhook
    webhook:
      address: "http://podwarden-responder.podwarden-system.svc.cluster.local:8080/webhook"
      method: "POST"
      minimumpriority: "error"   # error, critical, alert, emergency
    debug: false
