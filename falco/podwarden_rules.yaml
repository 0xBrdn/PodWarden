- macro: podwarden_container
  condition: >
    (container.id != host and
     k8s.ns.name != "kube-system" and
     k8s.ns.name != "podwarden-system" and
     k8s.ns.name != "falco")

- rule: PodWarden Interactive Shell Spawned
  desc: Detect interactive shell execution inside an application container
  condition: >
    spawned_process and podwarden_container and
    proc.name in (bash, sh, zsh, ash, dash)
  output: >
    Interactive shell spawned (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name cmdline=%proc.cmdline container=%container.name image=%container.image.repository)
  priority: ERROR
  tags: [podwarden, container, shell]

- rule: PodWarden Forbidden Recon Binary
  desc: Detect execution of network reconnaissance or transfer tools inside a container
  condition: >
    spawned_process and podwarden_container and
    proc.name in (curl, wget, nc, netcat, nmap, socat)
  output: >
    Forbidden recon binary executed (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name proc=%proc.name cmdline=%proc.cmdline image=%container.image.repository)
  priority: CRITICAL
  tags: [podwarden, container, recon]

- rule: PodWarden K8s ServiceAccount Token Access
  desc: Detect unauthorized read access to the Kubernetes ServiceAccount token
  condition: >
    (evt.type in (open, openat, openat2) and evt.is_open_read=true and fd.typechar='f') and
    podwarden_container and
    fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount and
    not proc.name in (kubelet, containerd, crio, dockerd)
  output: >
    K8s ServiceAccount token read (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name proc=%proc.name file=%fd.name cmdline=%proc.cmdline image=%container.image.repository)
  priority: CRITICAL
  tags: [podwarden, container, credential_access, T1552]

- rule: PodWarden Sensitive File Read
  desc: Detect read access to /etc/shadow or /etc/sudoers inside a container
  condition: >
    (evt.type in (open, openat, openat2) and evt.is_open_read=true and fd.typechar='f') and
    podwarden_container and
    fd.name in (/etc/shadow, /etc/sudoers)
  output: >
    Sensitive file read (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name proc=%proc.name file=%fd.name image=%container.image.repository)
  priority: CRITICAL
  tags: [podwarden, container, credential_access]

- rule: Drop and execute new binary in container
  append: true
  condition: and not (proc.name = mount and proc.pname = mount-product-f)
