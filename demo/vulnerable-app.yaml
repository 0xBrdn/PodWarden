# Intentionally "vulnerable" workload: default ServiceAccount token mounted,
# no NetworkPolicy, runs as root. It exists to be attacked by simulate_attack.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: prod-apps
  labels:
    app: vulnerable-app
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
        environment: production
    spec:
      containers:
        - name: app
          # Stock entrypoint on purpose: a custom `/bin/sh -c` entrypoint would
          # look like an attacker to the shell rule at every pod start.
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-app
  namespace: prod-apps
  labels:
    app: vulnerable-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: vulnerable-app
